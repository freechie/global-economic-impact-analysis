[project]
name = "global-economic-impact-analysis"
version = "0.1.0"
description = "World Bank GDP notebook with Plotly charts."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "ipykernel==6.31.0",
    "nbconvert==7.17.1",
    "nbformat==5.10.4",
    "pandas==3.0.3",
    "plotly==6.7.0",
    "statsmodels==0.14.6",
]

[dependency-groups]
dev = [
    "kaleido==1.3.0",
    "pytest==9.0.3",
]

[tool.uv]
package = false
required-version = "==0.11.29"

[tool.pytest.ini_options]
filterwarnings = [
    "error:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
]
